<style>
/* Layout: a pinboard. Sticky bar with board filters + search; masonry of pins (CSS columns); click a pin for a close-up dialog. */
:root{
  --bg:#FBFAF8; --pin:#FFFFFF; --ink:#151515; --muted:#62615D; --rule:#E7E4DE; --chip:#EFEDE8;
  --accent:#D9412B; --accent-ink:#FFFFFF;
  --t1:#F3DCCF; --t2:#DCE6F2; --t3:#E2EDDD; --t4:#EFE3F3; --t5:#F5EBCB;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111111; --pin:#1C1C1C; --ink:#F2F1EE; --muted:#A3A19B; --rule:#2C2C2C; --chip:#262626;
  --accent:#FF6A50; --accent-ink:#111111;
  --t1:#3A2A22; --t2:#1F2A38; --t3:#22301F; --t4:#30243A; --t5:#3A3220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --pin:#1C1C1C; --ink:#F2F1EE; --muted:#A3A19B; --rule:#2C2C2C; --chip:#262626;
  --accent:#FF6A50; --accent-ink:#111111;
  --t1:#3A2A22; --t2:#1F2A38; --t3:#22301F; --t4:#30243A; --t5:#3A3220; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.bar-top{display:flex;gap:10px;align-items:center}
.me{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 16px var(--display)}
.me b{font:700 16px var(--display)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:999px;padding:0 16px;height:44px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.search svg{flex:none;opacity:.6}
.contact{flex:none;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:0 18px;height:44px;font-weight:600;cursor:pointer;text-decoration:none;display:grid;place-items:center}
.boards{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.boards button{flex:none;border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--ink)}
.boards button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.boards button:not([aria-pressed="true"]):hover{background:var(--chip)}
@media (max-width:560px){.me b{display:none}.contact{padding:0 14px}}

main{padding:8px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.board{columns:4 250px;column-gap:16px;max-width:1400px;margin:0 auto}
.pin{break-inside:avoid;margin:0 0 16px;display:block;width:100%;text-align:left;border:0;padding:0;background:none;cursor:pointer;color:inherit}
.pin[hidden]{display:none}
.art{border-radius:20px;overflow:hidden;position:relative;background:var(--chip);transition:filter .15s}
.pin:hover .art{filter:brightness(.94)}
.save{position:absolute;top:12px;right:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;opacity:0;transition:opacity .15s}
.pin:hover .save,.pin:focus-visible .save{opacity:1}
@media (hover:none){.save{display:none}}
.cap{padding:8px 4px 0;display:grid;gap:2px}
.cap b{font-weight:600;font-size:15px;line-height:1.3}
.cap span{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* pin art (all drawn with CSS/SVG, no stock images) */
.art-pad{padding:20px;display:grid;gap:12px}
.hello{background:var(--t1)}
.hello h1{font:800 clamp(30px,4vw,40px)/1.02 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.hello p{margin:0}
.status{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#2E9E5B}
.metric{background:var(--t2)}
.big{font:800 64px/.9 var(--display);letter-spacing:-.03em}
.metric small{font-weight:600}
.trace{display:grid;gap:7px;font:500 11px var(--mono)}
.trace div{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center}
.trace i{display:block;height:10px;border-radius:3px;background:var(--ink);opacity:.85}
.label{background:var(--t5);font:500 12.5px/1.6 var(--mono)}
.label .hl{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 3px}
.label .warn{text-decoration:underline wavy var(--accent);text-underline-offset:3px}
.verdict{font:800 22px var(--display);color:var(--accent)}
.toon{aspect-ratio:4/5;background:linear-gradient(105deg,transparent 49.6%,var(--ink) 49.6% 50.4%,transparent 50.4%),
  linear-gradient(90deg,#d6d6d6 0 50%,transparent 50%),linear-gradient(160deg,#2b6cb0,#e53e3e 55%,#f6c945)}
.toon svg{position:absolute;inset:0;width:100%;height:100%}
.toon .tag{position:absolute;bottom:12px;font:600 12px var(--mono);background:var(--pin);border-radius:999px;padding:4px 10px}
.agents{background:var(--t3)}
.lanes{display:grid;gap:8px}
.lane{display:flex;align-items:center;gap:8px;font:500 12px var(--mono)}
.lane span{width:62px}
.lane i{height:22px;border-radius:6px;background:var(--pin);display:block;position:relative}
.lane i::after{content:"";position:absolute;inset:4px auto 4px 4px;width:calc(100% - 8px);border-radius:3px;background:var(--ink);opacity:.8}
.exp{background:var(--t4)}
.exp .when{font:500 12px var(--mono);color:var(--muted)}
.exp h3{margin:0;font:800 22px/1.1 var(--display)}
.stack{display:flex;flex-wrap:wrap;gap:6px}
.stack span{background:var(--pin);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:500}
.edu{background:var(--t2)}
.quote{background:var(--ink);color:var(--bg)}
.quote p{font:600 22px/1.25 var(--display);margin:0}

/* close-up */
dialog{border:0;padding:0;border-radius:28px;width:min(920px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--pin);color:var(--ink);box-shadow:0 20px 60px rgb(0 0 0 / .25)}
dialog::backdrop{background:rgb(0 0 0 / .55)}
.close-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.close-art{padding:16px}
.close-art .art{height:100%}
.close-body{padding:28px 28px 28px 12px;display:grid;gap:14px;align-content:start;min-width:0}
.close-body h2{margin:0;font:800 30px/1.08 var(--display);letter-spacing:-.01em;text-wrap:balance}
.close-body p{margin:0;max-width:62ch}
.close-body ul{margin:0;padding-left:18px;display:grid;gap:6px}
.kicker{font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.note{font-size:13.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;border-radius:999px;padding:10px 18px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.x{position:absolute;z-index:2;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);cursor:pointer;font-size:20px;line-height:1}
@media (max-width:720px){.close-wrap{grid-template-columns:minmax(0,1fr)}.close-body{padding:4px 22px 26px}.close-art .art{max-height:300px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const DETAIL = {
  hello: {kicker: "About", title: "Aruna Samhitha", html: `
    <p>I'm an AI and software engineer finishing an MS in Computer Engineering at San José State University (December 2026). I like the part of AI work that turns a model into something people rely on: tool calling, retrieval, permissions, evaluation and the full-stack app around it.</p>
    <p>Most recently I built a production AI assistant at Palo Alto Networks. Before grad school I spent a year and a half building payment and self-checkout APIs at Colruyt Group.</p>
    <p>I'm looking for new-grad software, AI and ML engineering roles.</p>`,
    actions: [["Email me", "mailto:arunasamhitha.mutyala@sjsu.edu"], ["GitHub", "https://github.com/ArunaSamhitha"]]},
  panw: {kicker: "Palo Alto Networks · Software Engineering Intern, AI · Summer 2026", title: "An AI assistant for an internal observability platform", html: `
    <p>Engineers across 60+ teams filed tickets for questions the platform could already answer. I built an end-to-end agent that resolves the issues behind 47% of those requests through self-service, across 18 environments.</p>
    <ul>
      <li>Production agent in Python with Google ADK, MCP, RAG and tool calling, integrating 26 tools across permissions, metrics, documentation, Helm workflows and navigation.</li>
      <li>Combined semantic retrieval with live platform data to cut prompt size by 59%. Every tool call runs under server-verified identity and permission-aware access.</li>
      <li>Seven diagnostic tools with BigQuery caching and fuzzy entity matching that find tenants, analyze metric cardinality and flag high-cardinality ingestion risks.</li>
      <li>React/TypeScript frontend, Node.js integration layer and FastAPI services on GKE with Helm, with agent, retrieval and tool calls traced in Langfuse.</li>
    </ul>
    <p class="note">Internal work, so there's no public code. Happy to walk through the architecture.</p>`, actions: []},
  cartlog: {kicker: "Project · AI agents", title: "CartLog AI: snap a product, three agents shop in parallel", html: `
    <p>Take a photo of a product or describe it. A vision-language model turns it into a structured search. Research, eBay and Amazon agents run as separate MCP servers and are called at the same time, each with its own timeout, so one slow marketplace never blocks the answer.</p>
    <ul>
      <li>Parallel fan-out over MCP cut median latency from 2.6 s to 1.1 s (59%) in the benchmark, measured with simulated API latency.</li>
      <li>Ranks listings by relevance, value against the researched price range, and rating.</li>
      <li>Remembers past searches with SQLite plus vector recall (Pinecone, or local cosine similarity).</li>
      <li>Runs end to end with no API keys on mock data. CI drives a real browser through a search on every push.</li>
    </ul>`, actions: [["View code", "https://github.com/ArunaSamhitha/CartLog-AI"]]},
  allergen: {kicker: "Project · Applied ML", title: "AllergenCheck: is this label safe for me?", html: `
    <p>Photograph an ingredient list, scan a barcode or paste the text, and get a verdict against your allergies and diet. Every flag points at the exact words on the label that caused it.</p>
    <ul>
      <li>Version 1 let an LLM decide. Version 2 uses a deterministic engine: 9 major allergens plus diets, label synonyms (whey → milk, semolina → wheat) and look-alike guards (nutmeg, cocoa butter, buckwheat).</li>
      <li>Reads "Contains" statements and "may contain" warnings separately, and repairs OCR typos without "correcting" real words.</li>
      <li>OpenCV + Tesseract OCR in memory, Open Food Facts barcode lookup, FastAPI, Docker, and CI that runs real OCR on every push.</li>
    </ul>`, actions: [["View code", "https://github.com/ArunaSamhitha/Food-Allergen-Detection-System"]]},
  cyclegan: {kicker: "Project · Computer vision", title: "Coloring black-and-white cartoons with CycleGAN", html: `
    <p>A CycleGAN that learns to color cartoon frames without paired examples. It splits one folder of color frames into a grayscale half and a color half, so the model never sees the true colors of what it colors.</p>
    <ul>
      <li>ResNet generators, 70×70 PatchGAN discriminators, adversarial + cycle-consistency + identity losses, an image history buffer and linear LR decay.</li>
      <li>Trained on public-domain 1940s Fleischer Superman shorts on a Colab T4, holding one episode out for testing.</li>
      <li>Colorizes images, folders or whole videos, and measures throughput in frames per second.</li>
    </ul>`, actions: [["View code", "https://github.com/ArunaSamhitha/Cartoon-Colorization-Using-CycleGAN"]]},
  quote: {kicker: "Notes", title: "What I've learned building agents", html: `
    <ul>
      <li><b>Retrieval beats a bigger prompt.</b> Pulling only the relevant docs and live data cut prompt size by 59% and made answers more grounded.</li>
      <li><b>Permissions belong on the server.</b> The agent should never be the thing deciding who's allowed to do what.</li>
      <li><b>Every tool call needs a timeout.</b> One slow dependency shouldn't take down the whole answer.</li>
      <li><b>Trace everything.</b> Without traces of retrieval and tool calls, you can't debug or evaluate an agent.</li>
      <li><b>Not everything should be an LLM.</b> For allergen safety, rules you can audit beat a model you can't.</li>
    </ul>`, actions: []},
  colruyt: {kicker: "Colruyt Group · Software Engineer · Feb 2023 – Jul 2024", title: "Payments and self-checkout integration", html: `
    <ul>
      <li>15+ RESTful APIs for self-checkout and payment systems, holding sub-100 ms p95 latency under load.</li>
      <li>Reusable integration services across payment gateways that cut cross-application integration overhead by 35%.</li>
      <li>Jenkins CI/CD that containerized 12 services with Docker, with health checks and Kibana logging, cutting deployment downtime by 30%.</li>
      <li>Platform upgrade across 12 production servers at 99.99% availability.</li>
    </ul>`, actions: []},
  research: {kicker: "San José State University · Research Assistant · Oct 2025 – Jun 2026", title: "Technology adoption and health outcomes", html: `
    <p>Built an AI-assisted platform that analyzes links between technology adoption and health outcomes, with statistical models behind decision-support features.</p>
    <p>React and FastAPI dashboards visualize relationship patterns, model outputs and metrics, with APIs tuned for low-latency inference.</p>`, actions: []},
  skills: {kicker: "Skills", title: "Tools I work with", html: `
    <ul>
      <li><b>AI engineering:</b> Google ADK, LangGraph, LangChain, MCP, agent orchestration, RAG, vector search, evaluation, guardrails, Langfuse</li>
      <li><b>ML:</b> PyTorch, Hugging Face Transformers, scikit-learn, computer vision, NLP, multimodal models</li>
      <li><b>Backend &amp; full-stack:</b> Python, SQL, TypeScript, FastAPI, Node.js, React, PostgreSQL</li>
      <li><b>Cloud &amp; infra:</b> GCP (Vertex AI, BigQuery, GKE), Kubernetes, Docker, Helm, OpenTelemetry, CI/CD</li>
    </ul>`, actions: []},
};

const pins = [...document.querySelectorAll(".pin")];
const dialog = document.getElementById("closeup");
let board = "all";

function filter() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  let shown = 0;
  for (const pin of pins) {
    const d = DETAIL[pin.dataset.id];
    const text = (pin.innerText + " " + d.title + " " + d.html.replace(/<[^>]+>/g, " ")).toLowerCase();
    const ok = (board === "all" || pin.dataset.boards.split(" ").includes(board)) && (!q || text.includes(q));
    pin.hidden = !ok;
    shown += ok;
  }
  document.getElementById("empty").hidden = shown > 0;
}

document.querySelectorAll(".boards button").forEach((b) => b.addEventListener("click", () => {
  board = b.dataset.board;
  document.querySelectorAll(".boards button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  filter();
}));
document.getElementById("q").addEventListener("input", filter);

function open(id) {
  const d = DETAIL[id], pin = pins.find((p) => p.dataset.id === id);
  if (!d || !pin) return;
  document.getElementById("cu-art").innerHTML = pin.querySelector(".art").outerHTML;
  document.getElementById("cu-body").innerHTML = `<span class="kicker">${d.kicker}</span><h2 id="cu-title">${d.title}</h2>${d.html}` +
    (d.actions.length ? `<div class="actions">${d.actions.map(([t, u], i) => `<a class="btn${i ? " ghost" : ""}" href="${u}" target="_blank" rel="noopener">${t}</a>`).join("")}</div>` : "");
  if (!dialog.open) dialog.showModal();
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
}
function close() {
  if (dialog.open) dialog.close();
}
dialog.addEventListener("close", () => { if (location.hash) history.replaceState(null, "", location.pathname + location.search); });
pins.forEach((p) => p.addEventListener("click", () => open(p.dataset.id)));
document.getElementById("cu-close").addEventListener("click", close);
dialog.addEventListener("click", (e) => { if (e.target === dialog) close(); });
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); id && DETAIL[id] ? open(id) : close(); });
if (location.hash.slice(1) in DETAIL) open(location.hash.slice(1));
</script>
</body>
</html>
